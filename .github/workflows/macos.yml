name: macOS

on:
  pull_request:
    branches: [develop, master]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install libraries
        run: brew install glfw libpng jpeg-turbo webp giflib librsvg pkg-config

      - name: Build
        run: ./build_macos.sh

      - name: Make dmg
        run: |
          mkdir dist
          cp rsiv.out dist/
          hdiutil create -volname rsiv -srcfolder dist -ov -format UDZO rsiv-macos.dmg

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: rsiv-macos
          path: rsiv-macos.dmg
