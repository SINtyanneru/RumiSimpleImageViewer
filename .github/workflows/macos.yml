name: macOS

on:
  pull_request:
    branches: [develop, master]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install libraries
        run: brew install glfw libpng jpeg-turbo webp giflib librsvg pkg-config dylibbundler create-dmg

      - name: Package (.app + dmg)
        run: ./package_macos.sh

      - name: Smoke test (thumbnail)
        run: |
          printf '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="80"><rect width="100" height="80" fill="#A8EDEA"/></svg>' > /tmp/t.svg
          ./rsiv.app/Contents/MacOS/rsiv --thumbnail /tmp/t.svg /tmp/t.png 128
          test -s /tmp/t.png

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: rsiv-macos
          path: rsiv-macos.dmg
